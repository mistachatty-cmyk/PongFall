# Auto-translate locale files whenever the English source changes.
#
# Drop this file into .github/workflows/ (or run `npx @lok/auto-l10n init`).
# No API keys or secrets are needed: translation uses the free Google Translate
# web endpoint through @vitalets/google-translate-api.
#
# Edit the paths below if your locale folder is not ./locales.
name: Auto-translate locales

on:
  push:
    paths:
      - 'src/**'
      - 'public/*.html'
      - 'scripts/*-strings.ts'
      - 'l10n.config.json'
      - 'l10n.auto.config.json'
  workflow_dispatch:
  # Google may rate limit a first run part way through. This finishes the job
  # later; when nothing is missing it does nothing and commits nothing.
  schedule:
    - cron: '17 */6 * * *'

# One run at a time, so two quick pushes never fight over the same files.
concurrency:
  group: auto-l10n
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    # Google first (best wording); when it rate limits the runner, Argos takes over
    # so a first run finishes in one go. Later runs only send new or changed strings.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Argos Translate: the unlimited fallback engine. Free, runs on the runner, no key.
      # CPU-only torch keeps the install small; models (~100 MB per language) are cached.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/pip
          key: argos-${{ runner.os }}-v1

      - name: Install Argos Translate
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate

      # Every word the game can show goes into the automatic catalogue: first what is written in the source, then what the running game really draws
      # (menus, pause world, match, end screen, lab, rules pages), canvas text included. Anything new is translated below with no one touching a file.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build the game and collect every string it shows
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec vite preview --port 4173 &
          sleep 4
          npx playwright-core install --with-deps chromium
          pnpm exec tsx scripts/scan-strings.ts
          pnpm exec tsx scripts/crawl-strings.ts

      - name: Translate new and changed strings
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix lib/auto-l10n
          node lib/auto-l10n/bin/auto-translate.js sync
          node lib/auto-l10n/bin/auto-translate.js sync --config l10n.auto.config.json

      - name: Commit translated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(l10n): auto-translate new strings'
          file_pattern: 'src/locales/*.json src/locales/.l10n-lock.json public/locales/auto/*.json public/locales/auto/.l10n-lock.json'
